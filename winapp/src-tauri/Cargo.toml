[package]
name = "vellin-winapp"
version = "0.1.0"
description = "Vellin — десктоп-клиент для Windows"
authors = ["Vellin"]
edition = "2021"

# Библиотека, которую дергает main.rs. Имя фиксировано, чтобы mobile-таргеты
# (в будущем Tauri 2 iOS/Android) могли переиспользовать ту же точку входа.
[lib]
name = "vellin_winapp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-http = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# По умолчанию используем системный WebView (WebView2 на Windows).
custom-protocol = ["tauri/custom-protocol"]
