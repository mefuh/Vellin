     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Vellin — совместный просмотр видео в реальном времени</title>
  <desc id="hero-desc">Название Vellin с промисом «комната, ссылка на видео — и все смотрят одно и то же, кадр в кадр» и карточкой комнаты: четыре участника, их таймлайны и плейхеды сведены в одну позицию 00:42:17, дрейф меньше 0,4 секунды.</desc>

  <rect width="1200" height="420" rx="26" fill="#0a0807"/>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="25.5" fill="none" stroke="#221c19"/>

  <g id="title-block" transform="translate(64 0)" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
