    <text x="76" y="157" font-size="80" font-weight="600" letter-spacing="-1.5" fill="#f6f1ed">Vellin</text>

    <text x="0" y="218" font-size="26" fill="#c8bdb5">Комната, ссылка на видео — и все</text>
    <text x="0" y="254" font-size="26" fill="#c8bdb5">смотрят одно и то же, кадр в кадр.</text>

