<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="608" viewBox="0 0 1200 608"
     role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Архитектура Vellin</title>
  <desc id="arch-desc">Два клиента — веб на React 18 с Vite и Zustand и нативный Windows-клиент на Flutter без WebView — ходят по REST и WebSocket в сервер на Fastify 5. Сервер держит комнаты, чат, плейлист, голосовые звонки, друзей, личные сообщения, push и админ-панель, а общие типы протокола лежат в пакете @vellin/shared. Снизу — PostgreSQL 16 с Prisma 5 и медиа-резолвер для mp4, webm, HLS, DASH, magnet и yt-dlp.</desc>

  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5a504a"/>
    </marker>
  </defs>

  <rect width="1200" height="608" rx="26" fill="#0a0807"/>
  <rect x="0.5" y="0.5" width="1199" height="607" rx="25.5" fill="none" stroke="#221c19"/>

  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <text x="64" y="60" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Menlo, Consolas, monospace"
          font-size="19" letter-spacing="2.5" fill="#8a7f78">АРХИТЕКТУРА</text>

    <g transform="translate(64 84)">
      <rect width="520" height="108" rx="16" fill="#14100e" stroke="#2b2421"/>
      <text x="28" y="46" font-size="24" font-weight="600" fill="#f6f1ed">Веб-клиент</text>
      <text x="28" y="80" font-size="20" fill="#8a7f78">React 18 · TypeScript · Vite · Zustand</text>
    </g>
    <g transform="translate(616 84)">
      <rect width="520" height="108" rx="16" fill="#14100e" stroke="#2b2421"/>
      <text x="28" y="46" font-size="24" font-weight="600" fill="#f6f1ed">Windows-клиент</text>
      <text x="28" y="80" font-size="20" fill="#8a7f78">Flutter (Dart) · без WebView</text>
    </g>

    <line x1="324" y1="192" x2="324" y2="236" stroke="#5a504a" stroke-width="1.5" marker-end="url(#a2)"/>
    <line x1="876" y1="192" x2="876" y2="236" stroke="#5a504a" stroke-width="1.5" marker-end="url(#a2)"/>
    <text x="600" y="222" font-size="19" fill="#8a7f78" text-anchor="middle">REST + WebSocket</text>

    <g transform="translate(64 242)">
      <rect width="1072" height="172" rx="16" fill="#14100e" stroke="#4a1a12"/>
      <rect width="4" height="172" rx="2" fill="#d1271b"/>
      <text x="28" y="48" font-size="24" font-weight="600" fill="#f6f1ed">Сервер Fastify 5 — источник истины</text>
      <g font-size="19" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Menlo, Consolas, monospace">
        <g transform="translate(28 66)">
          <rect width="128" height="34" rx="17" fill="#1a1614" stroke="#2b2421"/>
          <text x="20" y="23" fill="#c8bdb5">REST /api</text>
        </g>
        <g transform="translate(168 66)">
          <rect width="120" height="34" rx="17" fill="#1a1614" stroke="#2b2421"/>
          <text x="20" y="23" fill="#c8bdb5">WS /ws</text>
        </g>
        <g transform="translate(300 66)">
          <rect width="196" height="34" rx="17" fill="#1a1614" stroke="#2b2421"/>
          <text x="20" y="23" fill="#c8bdb5">OpenAPI /api/docs</text>
        </g>
      </g>
      <text x="28" y="140" font-size="20" fill="#8a7f78">комнаты · чат · плейлист · голосовые звонки · друзья · ЛС · push · админ-панель</text>
    </g>

    <line x1="324" y1="414" x2="324" y2="458" stroke="#5a504a" stroke-width="1.5" marker-end="url(#a2)"/>
    <line x1="876" y1="414" x2="876" y2="458" stroke="#5a504a" stroke-width="1.5" marker-end="url(#a2)"/>

    <g transform="translate(64 464)">
      <rect width="520" height="96" rx="16" fill="#14100e" stroke="#2b2421"/>
      <text x="28" y="42" font-size="22" font-weight="600" fill="#f6f1ed">PostgreSQL 16 + Prisma 5</text>
      <text x="28" y="72" font-size="19" fill="#8a7f78">комнаты, сообщения, друзья, кэш медиа</text>
    </g>
    <g transform="translate(616 464)">
      <rect width="520" height="96" rx="16" fill="#14100e" stroke="#2b2421"/>
      <text x="28" y="42" font-size="22" font-weight="600" fill="#f6f1ed">Медиа-резолвер</text>
      <text x="28" y="72" font-size="19" fill="#8a7f78">mp4 · webm · HLS · DASH · magnet · yt-dlp</text>
    </g>
  </g>
</svg>
